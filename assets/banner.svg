<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#090d16;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden"><defs><linearGradient id="bgGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#090d16"/><stop offset="100%" stop-color="#05080f"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="cardGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(99, 102, 241, 0.2)"/><stop offset="100%" stop-color="rgba(147, 51, 234, 0.05)"/></linearGradient><linearGradient id="cardGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(59, 130, 246, 0.2)"/><stop offset="100%" stop-color="rgba(14, 165, 233, 0.05)"/></linearGradient><linearGradient id="cardGrad3" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(236, 72, 153, 0.2)"/><stop offset="100%" stop-color="rgba(244, 63, 94, 0.05)"/></linearGradient><linearGradient id="lineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".8"/><stop offset="100%" stop-color="#c084fc" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes pulseOrb{0%{transform:scale(.9) translate(0,0);opacity:.35}}@keyframes floatItem1{0%{transform:translateY(0)}}@keyframes floatItem2{0%{transform:translateY(0)}}@keyframes floatItem3{0%{transform:translateY(0)}}@keyframes pulseBar1{0%{height:35px;y:295px}}@keyframes pulseBar2{0%