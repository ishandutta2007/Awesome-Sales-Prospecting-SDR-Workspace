<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.2)" />
      <stop offset="100%" stop-color="rgba(147, 51, 234, 0.05)" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.2)" />
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.05)" />
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(236, 72, 153, 0.2)" />
      <stop offset="100%" stop-color="rgba(244, 63, 94, 0.05)" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .bg-orb {
        animation: pulseOrb 8s ease-in-out infinite alternate;
      }
      .flow-pulse {
        animation: dashMove 14s linear infinite;
      }
      .badge-float-1 {
        animation: floatItem1 6s ease-in-out infinite alternate;
      }
      .badge-float-2 {
        animation: floatItem2 7s ease-in-out infinite alternate;
      }
      .badge-float-3 {
        animation: floatItem3 5.5s ease-in-out infinite alternate;
      }
      .bar-grow-1 {
        animation: pulseBar1 3s ease-in-out infinite alternate;
      }
      .bar-grow-2 {
        animation: pulseBar2 3.5s ease-in-out infinite alternate;
      }
      .bar-grow-3 {
        animation: pulseBar3 2.8s ease-in-out infinite alternate;
      }
      @keyframes pulseOrb {
        0% { transform: scale(0.9) translate(0px, 0px); opacity: 0.35; }
        100% { transform: scale(1.15) translate(30px, -20px); opacity: 0.65; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -200; }
      }
      @keyframes floatItem1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatItem2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(7px); }
      }
      @keyframes floatItem3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
      @keyframes pulseBar1 {
        0% { height: 35px; y: 295px; }
        100% { height: 60px; y: 270px; }
      }
      @keyframes pulseBar2 {
        0% { height: 50px; y: 280px; }
        100% { height: 75px; y: 255px; }
      }
      @keyframes pulseBar3 {
        0% { height: 25px; y: 305px; }
        100% { height: 50px; y: 280px; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Animated Glowing Ambience in Background -->
  <g class="bg-orb" style="transform-origin: 300px 100px;">
    <circle cx="300" cy="100" r="140" fill="#4338ca" filter="url(#glow)" />
  </g>
  <g class="bg-orb" style="transform-origin: 950px 180px; animation-delay: -3s;">
    <circle cx="950" cy="180" r="160" fill="#be185d" filter="url(#glow)" opacity="0.3" />
  </g>
  <g class="bg-orb" style="transform-origin: 650px 280px; animation-delay: -5s;">
    <circle cx="650" cy="280" r="120" fill="#0284c7" filter="url(#glow)" opacity="0.25" />
  </g>

  <!-- Dynamic Network Connection Grid (Layer behind text) -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4,6" opacity="0.4">
    <line x1="50" y1="90" x2="1150" y2="90" />
    <line x1="50" y1="210" x2="1150" y2="210" />
    <line x1="50" y1="310" x2="1150" y2="310" />
  </g>

  <!-- Dynamic Prospecting Cadence Flow Line -->
  <path d="M 60 160 Q 250 80, 480 150 T 880 140 T 1140 180" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="10, 10" class="flow-pulse" />

  <!-- Animated Lead Metrics Graphic (Bottom Right Background) -->
  <g opacity="0.5">
    <rect x="990" width="18" rx="4" class="bar-grow-1" fill="#38bdf8" />
    <rect x="1025" width="18" rx="4" class="bar-grow-2" fill="#818cf8" />
    <rect x="1060" width="18" rx="4" class="bar-grow-3" fill="#c084fc" />
    <rect x="1095" width="18" rx="4" class="bar-grow-2" fill="#f472b6" />
  </g>

  <!-- Floating Dynamic Pills / Status Tags (Positioned cleanly around) -->
  <g class="badge-float-1">
    <rect x="80" y="270" width="220" height="42" rx="21" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="105" cy="291" r="5" fill="#38bdf8" />
    <text x="122" y="296" fill="#e0f2fe" font-size="13" font-weight="600" letter-spacing="0.5">⚡ Multi-Channel Sequences</text>
  </g>

  <g class="badge-float-2">
    <rect x="325" y="270" width="210" height="42" rx="21" fill="url(#cardGrad1)" stroke="#a78bfa" stroke-width="1.2" />
    <circle cx="350" cy="291" r="5" fill="#a78bfa" />
    <text x="367" y="296" fill="#ede9fe" font-size="13" font-weight="600" letter-spacing="0.5">🎯 Automated Enrichment</text>
  </g>

  <g class="badge-float-3">
    <rect x="560" y="270" width="225" height="42" rx="21" fill="url(#cardGrad3)" stroke="#f472b6" stroke-width="1.2" />
    <circle cx="585" cy="291" r="5" fill="#f472b6" />
    <text x="602" y="296" fill="#ffe4e6" font-size="13" font-weight="600" letter-spacing="0.5">🤖 Self-Hosted AI SDR Agents</text>
  </g>

  <!-- Category Tag (Top Foreground) -->
  <g transform="translate(80, 52)">
    <rect width="210" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1" />
    <text x="105" y="19" fill="#c7d2fe" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">SALES ENGAGEMENT ECOSYSTEM</text>
  </g>

  <!-- Main Hero Titles (Foreground - Clear, bold, high-contrast) -->
  <text x="80" y="128" fill="url(#titleGrad)" font-size="40" font-weight="800" letter-spacing="-0.8">Sales Prospecting &amp; SDR Workspace</text>
  <text x="80" y="165" fill="#f8fafc" font-size="22" font-weight="600" letter-spacing="-0.2">Curated SaaS Platforms &amp; Autonomous Open-Source SDR Tools</text>

  <!-- Subtitle Description (Foreground) -->
  <text x="80" y="205" fill="#94a3b8" font-size="15" font-weight="400">
    The complete guide to outbound pipeline acceleration: contact enrichment, deliverability warm-up,
  </text>
  <text x="80" y="228" fill="#94a3b8" font-size="15" font-weight="400">
    omnichannel cadences (Email, LinkedIn, Calls), and self-hosted AI-driven sales reps.
  </text>
</svg>
